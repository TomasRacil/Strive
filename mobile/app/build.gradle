plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.strive.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.strive.mobile"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'

    // Native companion SDK. A PWA/WebView cannot talk to a Connect IQ app over
    // Bluetooth - this is the only supported path on Android.
    implementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.2.0'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM: the Android stub throws in unit tests.
    testImplementation 'org.json:json:20240303'
}
