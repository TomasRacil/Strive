name: CI

# Every PR, because the two surfaces move independently and have already broken
# each other once: PR #12 and PR #13 were both green on their own branch and the
# merge did not compile.
#
# The watch app is not built here. Its compiler (monkeyc) comes from the Connect
# IQ SDK, which is gated behind a Garmin account and a GUI installer, so there is
# no unattended way to install it on a runner. That gap is covered by running
# garmin/watch/build.ps1 and test.ps1 locally; see garmin/watch/README.md.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  web:
    name: PWA (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  android:
    name: Android (unit tests + debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # No android-actions/setup-android: ubuntu-latest already ships the SDK and
      # cmdline-tools at $ANDROID_HOME, and that action's default package list
      # asks for the legacy "tools" package, which Google has removed - it fails
      # with "Failed to find package 'tools'".
      - name: Unit tests
        working-directory: mobile
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Debug APK
        working-directory: mobile
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: mobile/app/build/reports/tests/
          if-no-files-found: ignore
